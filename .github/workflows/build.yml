name: Derleme

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Arayüz testleri
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm run typecheck

      - name: Çekirdek ve köprü testleri
        run: dotnet test DosyaTerzisi.sln --configuration Release

      - name: Paket
        shell: pwsh
        run: tools/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DosyaTerzisi
          path: release/*.zip
          if-no-files-found: error
